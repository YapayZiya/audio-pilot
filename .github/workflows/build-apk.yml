name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Download the APK of an existing EAS build. Leave empty to submit a new build.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo account that owns the EAS project. Override with the EAS_ACCOUNT variable.
  EXPO_ACCOUNT: ${{ vars.EAS_ACCOUNT || 'yapayziya' }}

jobs:
  build:
    name: Build APK (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo project config
        run: npx expo config --type public > /dev/null

      # EAS needs the project to be linked before a non-interactive build.
      # If EAS_PROJECT_ID is set as a repository secret the existing project is
      # linked, otherwise a project is created under EXPO_ACCOUNT.
      - name: Ensure EAS project is linked
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "Project is already linked via app.json (extra.eas.projectId)."
          elif [ -n "${EAS_PROJECT_ID:-}" ]; then
            npx eas-cli init --id "$EAS_PROJECT_ID" --non-interactive
          else
            npx eas-cli init --account "$EXPO_ACCOUNT" --non-interactive
          fi

      - name: Verify project is linked
        run: |
          set -euo pipefail
          node -e "
            const id = require('./app.json').expo?.extra?.eas?.projectId;
            if (!id) {
              console.error('extra.eas.projectId is still missing after eas init.');
              console.error('Check that EXPO_TOKEN is a valid Expo access token and that');
              console.error('the account in EXPO_ACCOUNT can create projects.');
              process.exit(1);
            }
            console.log('EAS project id: ' + id);
          "

      - name: Choose action
        id: mode
        env:
          REQUESTED_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_BUILD_ID:-}" ]; then
            echo "action=fetch" >> "$GITHUB_OUTPUT"
            echo "build_id=$REQUESTED_BUILD_ID" >> "$GITHUB_OUTPUT"
          else
            echo "action=submit" >> "$GITHUB_OUTPUT"
          fi

      # EAS builds run on Expo's servers and a free-tier queue can take a long
      # time, so the push trigger only submits and reports. The build continues
      # independently of this job.
      - name: Submit EAS build
        if: steps.mode.outputs.action == 'submit'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait --json > eas-build-result.json
          node -e "
            const fs = require('fs');
            const parsed = JSON.parse(fs.readFileSync('eas-build-result.json', 'utf8').trim());
            const build = (Array.isArray(parsed) ? parsed : [parsed]).find((b) => b && typeof b === 'object') ?? {};
            const id = build.id ?? '';
            const url = build.links?.build?.webUrl ?? '';
            if (!id) throw new Error('EAS did not return a build id');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_id=' + id + '\n');
            const summary = [
              '## EAS build submitted',
              '',
              '- status: ' + (build.status ?? 'unknown'),
              '- build id: `' + id + '`',
              '- dashboard: ' + url,
              '',
              'The build continues on Expo infrastructure. When it finishes, run this',
              'workflow manually with **build_id** = `' + id + '` to attach the APK',
              'to the run as an artifact.',
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            console.log('submitted build id: ' + id);
            console.log('dashboard: ' + url);
          "

      - name: Wait for build and download APK
        if: steps.mode.outputs.action == 'fetch'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.mode.outputs.build_id }}
          DASHBOARD: https://expo.dev/accounts/${{ vars.EAS_ACCOUNT || 'yapayziya' }}/projects/audiopilot/builds/${{ steps.mode.outputs.build_id }}
        run: |
          set -euo pipefail
          apk_url=""
          for attempt in $(seq 1 50); do
            if npx eas-cli build:view "$BUILD_ID" --json > view.json 2>/dev/null; then
              status=$(node -p "JSON.parse(require('fs').readFileSync('view.json','utf8')).status ?? ''" 2>/dev/null || echo "")
              echo "attempt ${attempt}/50  status=${status:-UNKNOWN}"
              case "$status" in
                FINISHED)
                  apk_url=$(node -p "JSON.parse(require('fs').readFileSync('view.json','utf8')).artifacts?.buildUrl ?? ''" 2>/dev/null || echo "")
                  break
                  ;;
                ERRORED|CANCELED)
                  echo "::error::EAS build ${BUILD_ID} ended with status ${status}"
                  node -e "
                    const fs = require('fs');
                    let b = {};
                    try { b = JSON.parse(fs.readFileSync('view.json', 'utf8')); } catch {}
                    if (b.error) {
                      console.log('errorCode: ' + (b.error.errorCode ?? 'n/a'));
                      console.log('error: ' + (b.error.message ?? 'n/a'));
                      console.log('docs: ' + (b.error.docsUrl ?? 'n/a'));
                    }
                    if (Array.isArray(b.logFiles) && b.logFiles.length) {
                      console.log('logFiles: ' + JSON.stringify(b.logFiles));
                    }
                    if (b.app?.slug) {
                      console.log('app: @' + (b.app.ownerAccount?.name ?? '?') + '/' + b.app.slug);
                    }
                  "
                  exit 1
                  ;;
              esac
            else
              echo "attempt ${attempt}/50  could not read build ${BUILD_ID} yet"
            fi
            sleep 30
          done
          if [ -z "$apk_url" ]; then
            echo "::error::Timed out waiting for build ${BUILD_ID}. Re-run this workflow with the same build_id once it finishes."
            echo "Dashboard: ${DASHBOARD}"
            exit 1
          fi
          echo "Downloading $apk_url"
          curl -sSL --retry 3 -o audiopilot-preview.apk "$apk_url"
          ls -lh audiopilot-preview.apk
          echo "## APK downloaded from build ${BUILD_ID}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK to workflow artifacts
        if: always() && hashFiles('audiopilot-preview.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: audiopilot-preview-apk
          path: audiopilot-preview.apk
          if-no-files-found: error