name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Download the APK of an existing EAS build instead of building the current commit.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo account that owns the EAS project. Override with the EAS_ACCOUNT variable.
  EXPO_ACCOUNT: ${{ vars.EAS_ACCOUNT || 'yapayziya' }}

jobs:
  build:
    name: Build APK (EAS)
    runs-on: ubuntu-latest
    # EAS free-tier queues can be long: checkout/tests ~5m + queue + build up to ~4h.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci

      - name: Verify Expo project config
        run: npx expo config --type public > /dev/null

      # EAS needs the project to be linked before a non-interactive build.
      # If EAS_PROJECT_ID is set as a repository secret the existing project is
      # linked, otherwise a project is created under EXPO_ACCOUNT.
      - name: Ensure EAS project is linked
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "Project is already linked via app.json (extra.eas.projectId)."
          elif [ -n "${EAS_PROJECT_ID:-}" ]; then
            npx eas-cli init --id "$EAS_PROJECT_ID" --non-interactive
          else
            npx eas-cli init --account "$EXPO_ACCOUNT" --non-interactive
          fi

      - name: Verify project is linked
        run: |
          set -euo pipefail
          node -e "
            const id = require('./app.json').expo?.extra?.eas?.projectId;
            if (!id) {
              console.error('extra.eas.projectId is still missing after eas init.');
              console.error('Check that EXPO_TOKEN is a valid Expo access token and that');
              console.error('the account in EXPO_ACCOUNT can create projects.');
              process.exit(1);
            }
            console.log('EAS project id: ' + id);
          "

      - name: Choose action
        id: mode
        env:
          REQUESTED_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_BUILD_ID:-}" ]; then
            echo "action=fetch" >> "$GITHUB_OUTPUT"
          else
            echo "action=submit" >> "$GITHUB_OUTPUT"
          fi

      # A new commit makes every previously queued build obsolete, and the
      # limited number of build slots on the Expo plan is shared across them.
      # Cancelling the superseded builds first keeps the current commit moving.
      - name: Cancel superseded queued builds
        if: steps.mode.outputs.action == 'submit'
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          npx eas-cli build:list --json --non-interactive --limit 50 > queued.json 2>/dev/null || exit 0
          ids=$(node -e "
            const fs = require('fs');
            let parsed;
            try { parsed = JSON.parse(fs.readFileSync('queued.json', 'utf8')); } catch { process.exit(0); }
            const builds = Array.isArray(parsed) ? parsed : (parsed?.builds ?? []);
            const pending = new Set(['NEW', 'IN_QUEUE', 'IN_PROGRESS', 'PENDING_CANCEL']);
            const sha = process.env.COMMIT_SHA;
            const stale = builds.filter((b) => {
              if (!b || !b.id) return false;
              const status = String(b.status ?? '').toUpperCase().replace(/-/g, '_');
              return pending.has(status) && b.gitCommitHash !== sha;
            });
            process.stdout.write(stale.map((b) => b.id).join(' '));
          ")
          for id in $ids; do
            echo "Cancelling superseded build $id"
            npx eas-cli build:cancel "$id" --non-interactive || true
          done

      - name: Submit EAS build
        id: submit
        if: steps.mode.outputs.action == 'submit'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait --json > eas-build-result.json
          node -e "
            const fs = require('fs');
            const parsed = JSON.parse(fs.readFileSync('eas-build-result.json', 'utf8').trim());
            const builds = Array.isArray(parsed) ? parsed : [parsed];
            const build = builds.find((b) => b && typeof b === 'object' && b.id) ?? {};
            if (!build.id) throw new Error('EAS did not return a build id');
            const account = build.app?.ownerAccount?.name ?? 'unknown';
            const slug = build.app?.slug ?? 'audiopilot';
            const dashboard = 'https://expo.dev/accounts/' + account + '/projects/' + slug + '/builds/' + build.id;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_id=' + build.id + '\n');
            const summary = [
              '## EAS build submitted',
              '',
              '- status: ' + (build.status ?? 'unknown'),
              '- build id: `' + build.id + '`',
              '- dashboard: ' + dashboard,
              '',
              'The workflow now waits for the build to finish on Expo infrastructure',
              '(free-tier queues can take a while). When it finishes, the APK is',
              'attached to this run as a workflow artifact.',
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            console.log('submitted build id: ' + build.id);
            console.log('dashboard: ' + dashboard);
          "

      - name: Wait for build to finish and get APK URL
        if: always() && (steps.mode.outputs.action == 'submit' || steps.mode.outputs.action == 'fetch')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUBMITTED_BUILD_ID: ${{ steps.submit.outputs.build_id }}
          REQUESTED_BUILD_ID: ${{ inputs.build_id }}
          DASHBOARD_ACCOUNT: ${{ vars.EAS_ACCOUNT || 'yapayziya' }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_BUILD_ID:-}" ]; then BUILD_ID="$REQUESTED_BUILD_ID"; else BUILD_ID="${SUBMITTED_BUILD_ID:-}"; fi
          if [ -z "${BUILD_ID:-}" ]; then
            echo "::error::No EAS build id available. The submit step did not complete or no build_id was provided."
            exit 1
          fi
          # Free-tier EAS queues + build can exceed an hour, so poll for up to
          # 120 minutes (240 x 30s) instead of giving up early.
          for attempt in $(seq 1 240); do
            if npx eas-cli build:view "$BUILD_ID" --json > view.json 2>/dev/null; then
              status=$(node -p "JSON.parse(require('fs').readFileSync('view.json','utf8')).status ?? ''" 2>/dev/null || echo "")
              echo "attempt ${attempt}/240  status=${status:-UNKNOWN}"
              case "$status" in
                FINISHED)
                  apk_url=$(node -p "JSON.parse(require('fs').readFileSync('view.json','utf8')).artifacts?.buildUrl ?? ''" 2>/dev/null || echo "")
                  if [ -n "$apk_url" ]; then
                    printf '%s' "$apk_url" > apk-url.txt
                    break
                  fi
                  echo "::error::Build ${BUILD_ID} finished but has no artifact URL."
                  exit 1
                  ;;
                ERRORED|CANCELED)
                  echo "::error::EAS build ${BUILD_ID} ended with status ${status}"
                  node -e "
                    const fs = require('fs');
                    let b = {};
                    try { b = JSON.parse(fs.readFileSync('view.json', 'utf8')); } catch {}
                    if (b.error) {
                      console.log('errorCode: ' + (b.error.errorCode ?? 'n/a'));
                      console.log('error: ' + (b.error.message ?? 'n/a'));
                      console.log('docs: ' + (b.error.docsUrl ?? 'n/a'));
                    }
                    if (Array.isArray(b.logFiles) && b.logFiles.length) {
                      console.log('logFiles: ' + JSON.stringify(b.logFiles));
                    }
                    if (b.app?.slug) {
                      console.log('dashboard: https://expo.dev/accounts/' + (b.app.ownerAccount?.name ?? process.env.DASHBOARD_ACCOUNT) + '/projects/' + b.app.slug + '/builds/' + b.id);
                    }
                  "
                  exit 1
                  ;;
              esac
            else
              echo "attempt ${attempt}/240  could not read build ${BUILD_ID} yet"
            fi
            sleep 30
          done
          if [ ! -f apk-url.txt ]; then
            echo "::error::Timed out waiting for build ${BUILD_ID} after 120 minutes."
            echo "Dashboard: https://expo.dev/accounts/${DASHBOARD_ACCOUNT}/projects/audiopilot/builds/${BUILD_ID}"
            echo "Re-run this workflow with build_id=${BUILD_ID} once it finishes."
            exit 1
          fi

      - name: Download APK
        if: always() && hashFiles('apk-url.txt') != ''
        run: |
          set -euo pipefail
          apk_url="$(cat apk-url.txt)"
          echo "Downloading $apk_url"
          curl -sSL --retry 3 -o audiopilot-preview.apk "$apk_url"
          ls -lh audiopilot-preview.apk

      - name: Upload APK to workflow artifacts
        if: always() && hashFiles('audiopilot-preview.apk') != ''
        uses: actions/upload-artifact@v5
        with:
          name: audiopilot-preview-apk
          path: audiopilot-preview.apk
          if-no-files-found: error
